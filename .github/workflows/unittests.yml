name: Python CI/CD Pipeline

on:
  push:
    branches: [ main, task-1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib scikit-learn nltk
    
    - name: Create simple EDA script for CI/CD
      run: |
        cat > test_eda.py << 'PYTHON'
import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
from datetime import datetime, timedelta
print("="*50)
print("CI/CD TEST - EDA ANALYSIS")
print("="*50)
# Create sample data
np.random.seed(42)
headlines = ["Fed raises rates", "Apple beats earnings", "Oil prices surge"]
publishers = ["Reuters", "Bloomberg", "WSJ"]

df = pd.DataFrame({
    'headline': np.random.choice(headlines, 50),
    'publisher': np.random.choice(publishers, 50),
    'date': [datetime.now() - timedelta(days=i) for i in range(50)]
})

# Statistics
df['word_count'] = df['headline'].str.split().str.len()
print(f"\n1. DESCRIPTIVE STATISTICS")
print(f"   Average headline length: {df['word_count'].mean():.1f} words")

# Publisher analysis
print(f"\n2. PUBLISHER ANALYSIS")
pub_counts = df['publisher'].value_counts()
for pub, count in pub_counts.items():
    print(f"   {pub}: {count} articles")
# Time series
print(f"\n3. TIME SERIES")
df['hour'] = pd.to_datetime(df['date']).dt.hour
print(f"   Peak hour: {df['hour'].mode()[0]}:00")
# Create visualization
plt.figure(figsize=(10,4))
plt.subplot(1,2,1)
df['word_count'].hist()
plt.title('Word Count')
plt.subplot(1,2,2)
df['publisher'].value_counts().plot(kind='bar')
plt.title('Publishers')
plt.tight_layout()
plt.savefig('ci_cd_output.png')
print(f"\n4. VISUALIZATION")
print("   Saved: ci_cd_output.png")

print("\n" + "="*50)
print("✅ CI/CD TEST PASSED!")
print("="*50)
PYTHON
    
    - name: Run EDA script
      run: python test_eda.py
    
    - name: Verify output
      run: |
        if [ -f "ci_cd_output.png" ]; then
          echo "✅ Visualization created successfully"
        else
          echo "❌ Visualization missing"
          exit 1
        fi
        echo "🎉 All tests passed!"
