name: Python CI/CD Pipeline

on:
  push:
    branches: [ main, task-1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # Use single version, not matrix
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib scikit-learn nltk
    
    - name: Test Python and imports
      run: |
        python --version
        python -c "import pandas; print('✅ Pandas works')"
        python -c "import numpy; print('✅ NumPy works')"
        python -c "import sklearn; print('✅ Scikit-learn works')"
    
    - name: Check EDA script
      run: |
        if [ -f "notebooks/eda_analysis.py" ]; then
          echo "✅ EDA script found"
        else
          echo "❌ EDA script missing"
          exit 1
        fi
    
    - name: Run EDA script (syntax check only)
      run: |
        python -m py_compile notebooks/eda_analysis.py
        echo "✅ EDA script syntax is valid