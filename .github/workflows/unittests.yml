name: Python CI/CD Pipeline

on:
  push:
    branches: [ main, task-1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10]  # Fixed: changed 3.1 to 3.10
    
    steps:
    - uses: actions/checkout@v4  # Updated from v3 to v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Updated from v4 to v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    
    - name: Install dependencies
      run: |
        pip install pandas numpy matplotlib scikit-learn nltk
    
    - name: Test imports
      run: |
        python -c "import pandas; print(f'✅ Pandas {pandas.__version__}')"
        python -c "import numpy; print(f'✅ NumPy {numpy.__version__}')"
        python -c "import sklearn; print(f'✅ Scikit-learn {sklearn.__version__}')"
    
    - name: Verify EDA script exists
      run: |
        test -f notebooks/eda_analysis.py && echo "✅ EDA script found" || echo "❌ EDA script missing"
    
    - name: Run syntax check
      run: |
        python -m py_compile notebooks/eda_analysis.py && echo "✅ Syntax check passed"